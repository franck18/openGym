<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<script>
  // Set direction before first paint so an Arabic profile never flashes as LTR.
  // The app re-applies this on every language change (lib/i18n.js setLang).
  // i18n-core RTL_LANGS is the runtime source of truth — keep this list in sync.
  try {
    var s = JSON.parse(localStorage.getItem('gym_state_v1') || '{}');
    var l = s.langAuto === true ? 'fr' : s.lang || 'fr';
    document.documentElement.lang = l;
    document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
  } catch (e) {}
  // Boot watchdog. A chunk this browser cannot parse (1.4.2's regex lookbehind on iOS 15.5 to
  // 16.3) kills the module graph before any of the app runs, and the logo lifted forever. Here,
  // outside the bundle and in plain old syntax, so it still runs then: a script that fails to
  // load or parse puts the reason where the logo was. The API can validly wait 20 s each for
  // config and the session, especially when the host wakes up: 10 s is a quiet progress message,
  // not a failure. After 50 s offer recovery outside the module graph. lib/boot.js removes #boot
  // (message included) once the app draws, so a slow start that gets there still gets there.
  (function () {
    var failed = false, last = '';
    function show(title, detail, failure) {
      var b = document.getElementById('boot');
      // Too early for the boot screen (a script in <head>): say it once the page is there.
      if (!b && document.readyState === 'loading') return document.addEventListener('DOMContentLoaded', function () { show(title, detail, failure); });
      if (failed || !b || b.getAttribute('data-leaving')) return;
      failed = failure;
      b.className = failure ? 'fail' : 'waiting';
      b.removeAttribute('aria-hidden');
      b.setAttribute('role', failure ? 'alert' : 'status');
      b.setAttribute('dir', 'ltr');
      b.setAttribute('lang', 'fr');
      b.innerHTML = '';
      var box = document.createElement('div'), h = document.createElement('p'), p = document.createElement('p');
      h.className = 'h';
      h.textContent = title;
      p.textContent = failure ? 'Réessayez, ou réparez le démarrage. Vos données sont conservées.' : 'Le serveur peut mettre quelques instants à se réveiller. Vos données sont conservées.';
      box.appendChild(h); box.appendChild(p);
      if (failure) {
        var c = document.createElement('code');
        c.textContent = (detail || 'Le chargement n’a pas encore abouti.') + ' (' + navigator.userAgent + ')';
        box.appendChild(c);
      }
      var r = document.createElement('button');
      r.type = 'button';
      r.textContent = 'Réessayer';
      r.onclick = function () { location.reload(); };
      var repair = document.createElement('a');
      repair.href = 'frayfit-repair.html';
      repair.textContent = 'Réparer le démarrage';
      box.appendChild(r); box.appendChild(repair);
      b.appendChild(box);
    }
    window.addEventListener('error', function (e) {
      var t = e && e.target;
      if (t && t.tagName === 'SCRIPT') return show('FrayFit ne peut pas démarrer.', 'Chargement impossible : ' + (t.src || 'un script'), true);
      if (!e || !e.message) return;
      last = e.message + (e.filename ? ' at ' + e.filename.split('/').pop() + ':' + e.lineno : '');
      if (/SyntaxError|Unexpected|Invalid regular expression/i.test(e.message)) show('FrayFit ne peut pas démarrer.', last, true);
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      var r = e && e.reason;
      if (r) last = String((r && r.message) || r);
    });
    setTimeout(function () {
      show('FrayFit se réveille…', '', false);
    }, 10000);
    setTimeout(function () {
      show(last ? 'FrayFit ne peut pas démarrer.' : 'La connexion prend plus de temps que prévu.', last, true);
    }, 50000);
  })();
</script>
<title>FrayFit</title>
<meta name="description" content="FrayFit — programmes, exercices et suivi de vos séances">
<meta name="theme-color" content="#285de5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FrayFit">
<!-- use-credentials: browsers fetch the manifest without cookies, even same-origin; behind an auth
     proxy (Authelia, Cloudflare Access, Teleport…) that fetch is a login redirect and the Home Screen
     icon comes out generic. iOS 26 reads the icon from the manifest, so this is where it shows. -->
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/svg+xml" href="frayfit-icon.svg">
</head>
<body>
<!-- The boot screen: painted with the HTML, before any script runs, so the gap between the
     native splash and the first real screen is the logo loading its plates instead of a black
     page. Cobalt identity for the personal FrayFit web edition. lib/boot.js takes it away the moment the
     app can draw, so it never adds a wait. -->
<style>
  #boot{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:#f5f7fb;transition:opacity .22s ease-out}
  #boot.out{opacity:0;pointer-events:none}
  #boot svg{width:112px;height:auto;overflow:visible}
  #boot rect,#boot ellipse{transform-box:fill-box;transform-origin:center}
  #boot .bar{animation:boot-bar .32s cubic-bezier(.3,.7,.4,1) both}
  #boot .pl{animation:boot-plate .28s cubic-bezier(.3,.7,.4,1.3) both}
  #boot .pr{animation:boot-plate-r .28s cubic-bezier(.3,.7,.4,1.3) both}
  #boot .in{animation-delay:.22s}
  #boot .outer{animation-delay:.36s}
  #boot .db{animation:boot-rep 1.25s ease-in-out .75s infinite}
  #boot ellipse{fill:#285de5;opacity:.12;animation:boot-shadow 1.25s ease-in-out .75s infinite}
  @keyframes boot-bar{from{transform:scaleX(0)}}
  @keyframes boot-plate{from{transform:translateX(-40px);opacity:0}}
  @keyframes boot-plate-r{from{transform:translateX(40px);opacity:0}}
  @keyframes boot-rep{50%{transform:translateY(-26px)}}
  @keyframes boot-shadow{50%{transform:scaleX(.72);opacity:.05}}
  #boot.fail,#boot.waiting{place-items:center;padding:24px}
  #boot.fail div,#boot.waiting div{max-width:340px;font:15px/1.4 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;color:#172338;text-align:center}
  #boot.fail .h,#boot.waiting .h{font-size:19px;font-weight:600;margin:0 0 8px}
  #boot.fail code{display:block;margin:14px 0 18px;padding:10px;border-radius:10px;background:#e9edf5;color:#172338;font-size:12px;text-align:left;word-break:break-word;-webkit-user-select:text;user-select:text}
  #boot.fail button,#boot.waiting button{font:inherit;font-weight:600;color:#ffffff;background:#285de5;border:0;border-radius:12px;min-height:44px;padding:0 28px}
  #boot.fail a,#boot.waiting a{display:block;margin-top:12px;padding:12px;color:#285de5;font-weight:600}
  @media (prefers-reduced-motion:reduce){
    #boot .bar,#boot .pl,#boot .pr,#boot ellipse{animation:none}
    #boot .db{animation:boot-breathe 1.6s ease-in-out infinite}
    @keyframes boot-breathe{50%{opacity:.55}}
  }
</style>
<div id="boot" aria-hidden="true">
  <svg viewBox="80 140 352 250">
    <ellipse cx="256" cy="372" rx="150" ry="9"/>
    <g class="db" fill="#285de5">
      <rect class="bar" x="80" y="242" width="352" height="28"/>
      <rect class="pl in" x="131" y="169" width="47" height="174"/>
      <rect class="pr in" x="334" y="169" width="47" height="174"/>
      <rect class="pl outer" x="80" y="199" width="36" height="114"/>
      <rect class="pr outer" x="396" y="199" width="36" height="114"/>
    </g>
  </svg>
</div>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
