<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#285de5">
  <title>Réparer le démarrage · FrayFit</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f7fb;color:#172338;font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{width:100%;max-width:440px;padding:30px;border:1px solid #dce3ef;border-radius:24px;background:#fff}h1{font-size:26px;line-height:1.2;margin:0 0 20px}p{margin:0 0 18px}button{width:100%;min-height:48px;padding:12px 20px;border:0;border-radius:12px;background:#285de5;color:#fff;font:inherit;font-weight:600;cursor:pointer}button:disabled{opacity:.65;cursor:wait}button:focus-visible,a:focus-visible{outline:3px solid #172338;outline-offset:4px}a{display:inline-block;padding:12px 0;color:#285de5}#status{min-height:26px;margin-top:18px;font-size:14px}
  </style>
  <script src="frayfit-repair.js" defer></script>
</head>
<body>
  <main>
    <h1>Retrouver FrayFit</h1>
    <p>Si le démarrage reste bloqué après une mise à jour, rechargez les fichiers de l’application.</p>
    <p><strong>Vos données sont conservées.</strong> Vos séances, programmes, photos et clés d’accès restent en place.</p>
    <button type="button" id="repair">Réparer le démarrage</button>
    <p id="status" role="status" aria-live="polite"></p>
    <a href="./">Retour à FrayFit</a>
    <noscript><p>Activez JavaScript pour relancer FrayFit.</p></noscript>
  </main>
</body>
</html>
